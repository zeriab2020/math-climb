<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Climb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: one column "workbook page" on graph paper. One problem at a time, worked the Saxon way. */
:root{
  --bg:#fff0f6; --paper:#ffffff; --grid:#fde4ef; --ink:#3a1631; --muted:#8a5a7c; --line:#f6c9dd;
  --accent:#e23d8a; --accent-2:#a35bf0; --accent-ink:#ffffff; --sun:#ffb703; --good:#13926a; --good-bg:#e1f7ee;
  --bad:#c8326b; --bad-bg:#ffe3ee; --hint-bg:#fff4d6; --hint-line:#f5d47e; --track:#fbd3e5;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1d0d19; --paper:#2a1424; --grid:#381c30; --ink:#ffe8f3; --muted:#d6a3c3; --line:#4d2742;
  --accent:#ff6fb1; --accent-2:#c79bff; --accent-ink:#2a0d1f; --sun:#ffc84a; --good:#5fe0ad; --good-bg:#123326;
  --bad:#ff86ad; --bad-bg:#3d1527; --hint-bg:#352a10; --hint-line:#6d5a1f; --track:#4a2140; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d0d19; --paper:#2a1424; --grid:#381c30; --ink:#ffe8f3; --muted:#d6a3c3; --line:#4d2742;
  --accent:#ff6fb1; --accent-2:#c79bff; --accent-ink:#2a0d1f; --sun:#ffc84a; --good:#5fe0ad; --good-bg:#123326;
  --bad:#ff86ad; --bad-bg:#3d1527; --hint-bg:#352a10; --hint-line:#6d5a1f; --track:#4a2140; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);background-image:radial-gradient(circle at 12% 8%,var(--grid) 0 70px,transparent 71px),radial-gradient(circle at 92% 30%,var(--grid) 0 46px,transparent 47px);background-attachment:fixed;color:var(--ink);font:400 1rem/1.5 var(--body)}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
h1{font:800 2.3rem/1 var(--display);margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.stars{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--sun);color:var(--ink);border-radius:999px;padding:4px 12px;font:800 1.05rem var(--display)}
.stars i{color:var(--sun);font-style:normal;font-size:1.2rem}
.trail{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;gap:8px}
.trail .lbl{display:flex;justify-content:space-between;padding-right:26px;font:800 .95rem var(--display);color:var(--muted)}
.track{position:relative;height:18px;border-radius:999px;background:var(--track)}
.fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .4s ease}
.climber{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;transition:left .4s ease}
.flag{position:absolute;right:-4px;top:-20px;width:22px;height:26px}
.hello{margin:2px 0 0;color:var(--muted);font-weight:700}
.name{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);font-size:.9rem}
.name input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 10px;width:9.5em}

.today .lbl{font:800 .75rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.dot{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--paper);font:600 .65rem/20px var(--mono);text-align:center;color:var(--muted)}
.dot.ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.dot.fix{background:var(--hint-bg);color:var(--ink);border-color:transparent}
.dot.no{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.dot.cur{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card{background-color:var(--paper);border-radius:22px!important;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;box-shadow:0 1px 0 var(--line)}
.top{display:flex;justify-content:space-between;gap:8px;font:800 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ask{font:700 1.1rem/1.45 var(--body);margin:0;text-wrap:balance}
.word{font:600 1.1rem/1.55 var(--body);margin:0;max-width:60ch}
.prob{display:flex;justify-content:center;padding:6px 0}
.vert{display:inline-grid;font:500 2rem/1.25 var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.vert .op{border-bottom:3px solid var(--ink);padding-bottom:2px}
.ld{display:inline-grid;grid-template-columns:auto auto;font:500 2rem/1.3 var(--mono);font-variant-numeric:tabular-nums}
.ld .qrow{grid-column:2;white-space:pre;padding:0 .3em 0 .35em;color:var(--accent);min-height:1.3em}
.ld .dv{padding-right:.12em;align-self:end}
.ld .dd{border-top:3px solid var(--ink);border-left:3px solid var(--ink);border-top-left-radius:.45em;padding:0 .3em 0 .35em;white-space:pre}
form.ans{display:flex;flex-wrap:wrap;gap:8px}
form.ans input{flex:1 1 9em;min-width:0;font:500 1.4rem var(--mono);padding:10px 16px;border:3px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink)}
form.ans input:focus{outline:none;border-color:var(--accent)}
.btn{font:800 1.05rem var(--body);border:0;border-radius:999px;padding:13px 22px;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:var(--paper);color:var(--accent);border:2px solid var(--accent);box-shadow:none}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.soft{background:var(--hint-bg);color:var(--ink);border:2px solid var(--hint-line);box-shadow:none}
.btn:focus-visible,.name input:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tip{color:var(--muted);font-size:.88rem;margin:0}
.fb{border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.fb p{margin:0}
.fb.good{background:var(--good-bg);color:var(--good);font-weight:800}
.fb.bad{background:var(--bad-bg)}
.fb.bad b.h{color:var(--bad)}
.fb.hint{background:var(--hint-bg);border:1px solid var(--hint-line)}
.steps{display:grid;gap:10px;border-top:2px dashed var(--line);padding-top:12px}
.steps h3{margin:0;font:800 1.05rem var(--display)}
.done-step{font:600 .98rem/1.4 var(--body);color:var(--good)}
.done-step b{font:500 1.05rem var(--mono)}
.board{font:500 1.15rem/1.5 var(--mono);white-space:pre;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;overflow-x:auto}
.big{font:800 2.3rem/1.1 var(--display);margin:0;color:var(--accent)}
.cheer{display:grid;gap:12px;justify-items:center;text-align:center;padding:10px 0}
.cheer .earn{font:800 1.2rem var(--display);color:var(--sun)}
.topics{display:grid;gap:12px}
.topic{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:14px 16px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.topic:hover{border-color:var(--accent)}
.topic:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.topic.is-next{border-color:var(--accent);box-shadow:0 3px 0 var(--accent)}
.tnum{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:800 1.3rem var(--display);background:var(--track);color:var(--accent)}
.topic.is-done .tnum{background:var(--sun);color:#3a1631}
.tbody{display:grid;gap:2px;flex:1;min-width:0}
.ttl{font:800 1.15rem/1.2 var(--display)}
.tex{font:500 .95rem var(--mono);color:var(--muted)}
.pips{display:flex;gap:4px;margin-top:4px}
.pips i{width:22px;height:7px;border-radius:999px;background:var(--track)}
.pips i.on{background:var(--accent)}
.tag{flex:none;font:800 .78rem var(--body);border-radius:999px;padding:4px 10px;background:var(--track);color:var(--accent)}
.tag.next{background:var(--accent);color:var(--accent-ink)}
.tag.done{background:var(--sun);color:#3a1631}
.back{font:800 .85rem var(--body);background:none;border:0;color:var(--accent);cursor:pointer;padding:0;letter-spacing:0;text-transform:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
details.grown{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
details.grown summary{cursor:pointer;font-weight:800}
.rep{display:grid;gap:14px;margin-top:12px}
.rep h3{margin:0;font:800 1rem var(--display)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.miss{border-left:3px solid var(--bad);padding:4px 10px;font-size:.92rem}
.miss .meta{color:var(--muted);font-size:.8rem}
.g{color:var(--good);font-weight:800}.b{color:var(--bad);font-weight:800}
textarea{width:100%;min-height:8em;font:400 .85rem var(--mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
@media (prefers-reduced-motion:no-preference){.fb{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}}
</style>

<canvas id="confetti" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div><h1>Math <span>Climb</span></h1><p class="hello" id="hello">Pick a lesson to practice</p></div>
    <span class="stars" id="stars" title="Stars you have earned"><i>★</i> <b id="starN">0</b></span>
  </header>
  <div class="trail" id="today" aria-label="Your climb" hidden></div>
  <section class="topics" id="topics" aria-label="Lessons"></section>
  <main class="card" id="card" aria-live="polite"></main>
  <details class="grown" id="grown">
    <summary>Grown-up corner: progress report</summary>
    <div class="rep" id="rep"></div>
  </details>
</div>

<script>
// ---------- helpers ----------
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const N=n=>Number(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtS=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const dayKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const ROUND=10, KEY='mathclimb.v2';
let DB={};
function load(){try{DB=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){DB={}}
  DB.tp=DB.tp||{};DB.days=DB.days||{};DB.log=DB.log||[];DB.later=DB.later||{}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
const day=()=>{const k=dayKey();return DB.days[k]=DB.days[k]||{items:[],secs:0,hints:0}};

// ---------- problem generators (Saxon-style) ----------
// Multiplication ladder 1–10, division ladder 1–10. Levels are never shown to her.
const MLV=['','2-digit × 1-digit','2-digit × 1-digit, carrying','3-digit × 1-digit','2-digit × tens','2-digit × teens','2-digit × 2-digit','3-digit × 2-digit','money × 2-digit','4-digit × 2-digit','decimal × decimal'];
const DLV=['','2-digit ÷ 1-digit','2-digit ÷ 1-digit, regrouping','2-digit ÷ 1-digit, remainder','3-digit ÷ 1-digit','3-digit ÷ 1-digit, remainder/zero','4-digit ÷ 1-digit','÷ 2-digit, 1-digit answer','3-digit ÷ 2-digit','4-digit ÷ 2-digit','decimal ÷ whole number'];
const GRADE=l=>l<=3?'4th grade':l<=6?'4th–5th grade':l<=8?'5th grade':'6th grade';
function genM(L){
  let a,b,dp=0,money=false;
  if(L===1){b=R(2,4);do{a=R(11,44)}while((a%10)*b>9||Math.floor(a/10)*b>9)}
  else if(L===2){b=R(3,9);do{a=R(12,98)}while((a%10)*b<10)}
  else if(L===3){b=R(3,9);do{a=R(112,989)}while((a%10)*b<10)}
  else if(L===4){a=R(12,98);b=R(2,9)*10}
  else if(L===5){a=R(12,89);b=R(11,19)}
  else if(L===6){a=R(23,98);b=R(21,98);if(b%10===0)b++}
  else if(L===7){a=R(112,899);b=R(12,79);if(b%10===0)b++}
  else if(L===8){a=R(105,999);b=R(12,49);if(b%10===0)b++;money=true;dp=2}
  else if(L===9){a=R(1012,8999);b=R(12,69);if(b%10===0)b++}
  else{const k=pick([[R(12,99),1,R(12,99),1],[R(101,999),2,R(2,9),0],[R(11,99),1,R(11,39),0],[R(101,999),2,R(11,49),1]]);a=k[0];b=k[2];dp=k[1]+k[3];
    return finishM({a,b,da:k[1],db:k[3],dp,L})}
  return finishM({a,b,da:money?2:0,db:0,dp,money,L});
}
const dstr=(v,p)=>p?(v/10**p).toFixed(p):String(v);
function finishM(o){o.op='m';o.prod=o.a*o.b;o.sa=o.money?'$'+dstr(o.a,2):dstr(o.a,o.da);o.sb=dstr(o.b,o.db);
  o.ans=o.dp?dstr(o.prod,o.dp):String(o.prod);o.show=o.money?'$'+o.ans:o.dp?o.ans:N(o.prod);
  o.text=`${o.sa} × ${o.sb}`;return o}
function genD(L){
  let d,q,r=0,dec=0;
  if(L===1){d=R(2,4);q=R(1,Math.floor(9/d))*10+R(0,Math.floor(9/d));if(q<11)q+=10}
  else if(L===2){d=R(3,6);do{q=R(12,Math.floor(99/d))}while(Math.floor(q*d/10)%d===0)}
  else if(L===3){d=R(3,9);q=R(10,Math.floor(98/d));r=R(1,d-1);if(q*d+r>99)q--}
  else if(L===4){d=R(3,9);q=R(Math.ceil(100/d),Math.floor(999/d))}
  else if(L===5){d=R(3,9);q=Math.random()<.4?R(1,9)*100+R(1,9):R(Math.ceil(100/d),Math.floor(990/d));r=R(0,d-1)}
  else if(L===6){d=R(3,9);q=R(Math.ceil(1000/d),Math.floor(9999/d));r=Math.random()<.5?R(1,d-1):0}
  else if(L===7){d=R(11,19);q=R(2,9);r=Math.random()<.5?R(1,d-1):0}
  else if(L===8){d=R(12,39);q=R(11,Math.floor(999/d));r=Math.random()<.5?R(1,d-1):0}
  else if(L===9){d=R(12,59);q=R(Math.ceil(1000/d),Math.floor(9999/d));r=Math.random()<.4?R(1,d-1):0}
  else{d=R(2,9);q=R(11,199);dec=1}
  const n=d*q+r;
  const o={op:'d',d,q,r,n,dec,L};
  if(dec){o.sn=dstr(n,1);o.ans=dstr(q,1);o.show=o.ans;o.text=`${o.sn} ÷ ${d}`}
  else{o.sn=String(n);o.ans=r?`${q} R ${r}`:String(q);o.show=o.ans;o.text=`${n} ÷ ${d}`}
  if(String(q).length>String(n).length)return genD(L);
  return o;
}
// Saxon-style equal-groups word problems on the same numbers
const KIDS=['Marisa','Jamal','Lena','Tyrone','Sofia','Omar','Kayla','Ben'];
function wordify(o){
  if(o.op==='m'&&!o.dp&&o.L>=2){const t=pick([
     [`Each of the ${o.b} buses carried ${N(o.a)} students. How many students rode the buses?`],
     [`There are ${N(o.a)} crayons in each box. How many crayons are in ${o.b} boxes?`],
     [`${pick(KIDS)} planted ${o.b} rows of trees. There were ${N(o.a)} trees in each row. How many trees were planted?`]]);o.word=t[0];o.formula='Number of groups × Number in each group = Total';}
  if(o.op==='m'&&o.money){o.word=`${pick(KIDS)} bought ${o.b} books. Each book cost ${o.sa}. How much did all the books cost?`;o.formula='Price of one × Number bought = Total cost'}
  if(o.op==='d'&&!o.r&&!o.dec&&o.L>=2){const t=pick([
     `${N(o.n)} chairs were set up in ${o.d} equal rows. How many chairs were in each row?`,
     `${pick(KIDS)} shared ${N(o.n)} stickers equally among ${o.d} friends. How many stickers did each friend get?`,
     `A baker put ${N(o.n)} muffins into boxes of ${o.d}. How many boxes did the baker fill?`]);o.word=t;o.formula='Total ÷ Number in each group = Number of groups (or Total ÷ groups = number in each)'}
  return o;
}
// Lessons (topic blocks). Each lesson climbs through its own steps; 2 right in a row moves her up.
const TOPICS=[
 {id:'m21',title:'Multiply 2-digit by 1-digit',ex:'47 × 6',steps:[['m',1],['m',2]]},
 {id:'m31',title:'Multiply 3-digit by 1-digit',ex:'346 × 7',steps:[['m',3]]},
 {id:'m10',title:'Multiply by tens',ex:'38 × 40',steps:[['m',4]]},
 {id:'m22',title:'Multiply 2-digit by 2-digit',ex:'47 × 36',steps:[['m',5],['m',6]]},
 {id:'mbig',title:'Multiply bigger numbers',ex:'234 × 27',steps:[['m',7],['m',9]]},
 {id:'mmon',title:'Multiply money',ex:'$3.45 × 12',steps:[['m',8]]},
 {id:'mdec',title:'Multiply decimals',ex:'4.6 × 2.3',steps:[['m',10]]},
 {id:'d21',title:'Divide 2-digit by 1-digit',ex:'72 ÷ 3',steps:[['d',1],['d',2],['d',3]]},
 {id:'d31',title:'Divide 3- and 4-digit numbers',ex:'456 ÷ 6',steps:[['d',4],['d',5],['d',6]]},
 {id:'d2d',title:'Divide by a 2-digit number',ex:'552 ÷ 24',steps:[['d',7],['d',8],['d',9]]},
 {id:'ddec',title:'Divide decimals',ex:'7.5 ÷ 3',steps:[['d',10]]}];
const TP=id=>TOPICS.find(t=>t.id===id);
const tst=id=>DB.tp[id]=DB.tp[id]||{i:0,run:0,miss:0,done:false,n:0,first:0};
function newProblem(tid){const t=TP(tid),st=tst(tid),[op,L]=t.steps[Math.min(st.i,t.steps.length-1)];const o=op==='m'?genM(L):genD(L);if(Math.random()<.25)wordify(o);o.tid=tid;o.id=Date.now()+'-'+Math.random().toString(36).slice(2,6);return o}

// ---------- the Saxon method, as step-by-step work (she fills in every number) ----------
function stepsFor(o){
  const S=[];
  if(o.op==='m'){
    const A=o.a,B=o.b;
    if(o.dp&&!o.money){S.push({q:`First ignore the decimal points. Multiply ${A} × ${B}.`,a:String(A*B),h:`Work it in a column, ones first. Multiply by each digit of ${B} and add the rows.`});
      S.push({q:`Count the digits after the decimal points in ${o.sa} and ${o.sb}. How many in all?`,a:String(o.dp),h:`Count the digits to the right of the decimal point in each number, then add the two counts.`});
      S.push({final:true,q:`Now write your answer from the first step and put the decimal point so it has that many digits after it.`});return S}
    if(B<10){const ds=String(A).split('').reverse().map(Number);let c=0;const names=['ones','tens','hundreds','thousands'];
      ds.forEach((dg,i)=>{const v=dg*B+c;S.push({q:`Multiply ${B} × ${dg} (the ${names[i]} digit)${c?` and add the ${c} you carried`:''}.`,a:String(v),h:c?`First ${B} × ${dg}, then add ${c}.`:`Use your facts: count by ${B}s ${dg} times.`,note:i<ds.length-1&&v>=10?`Write the ${v%10} below the line. Carry the ${Math.floor(v/10)} above the next column.`:''});c=Math.floor(v/10)});
      S.push({final:true,q:'Read the digits you wrote below the line. What is the product?'});return S}
    const o1=B%10,t1=Math.floor(B/10)%10;
    if(o1===0){S.push({q:`${B} is ${t1} tens. Write a 0 in the ones place first. Then multiply ${A} × ${t1}. What do you get from ${A} × ${t1}?`,a:String(A*t1),h:`Multiply ${A} by ${t1}: ones digit first, and carry when you get 10 or more.`});
      S.push({final:true,q:'Now write that number with the 0 at the end. Type the product.'});return S}const cents=o.money?' (multiply the cents number, ignoring the $ and point)':'';
    S.push({q:`Row 1: multiply ${A} × ${o1}${cents}.`,a:String(A*o1),h:`Multiply ${A} by the ones digit ${o1}. Go right to left and carry when you get 10 or more.`});
    S.push({q:`Row 2: write a 0 in the ones place, then multiply ${A} × ${t1}. What number is in row 2 (with the 0)?`,a:String(A*t1*10),h:`Find ${A} × ${t1}, then put a 0 at the end, because you are really multiplying by ${t1} tens.`});
    S.push({q:'Add row 1 and row 2.',a:String(A*B),h:'Line up the rows by place value and add, ones column first.'});
    if(o.money)S.push({final:true,q:'Money has two digits after the decimal point. Write your total with a dollar sign and a decimal point.'});
    else S.push({final:true,q:'Type the product.'});

  // division: Divide, Multiply, Subtract, Bring down
  const s=String(o.dec?o.n:o.n),d=o.d;let cur=0,started=false;const ds=s.split('');

    else S.push({q:`How many ${d}s are in ${cur}? (Write the digit above the ${ds[i]}. If ${d} doesn't fit, write 0.)`,a:String(Math.floor(cur/d)),h:cur<d?`${cur} is less than ${d}, so how many fit?`:d>=10?`Round ${d} to ${Math.round(d/10)*10} to guess, then check by multiplying.`:`Count by ${d}s without going past ${cur}.`,pos:i,qd:true});

    if(i<ds.length-1)S.push({q:`Bring down the next digit, ${ds[i+1]}. What number do you have now?`,a:String(left*10+ +ds[i+1]),h:`Write the ${ds[i+1]} next to ${left}.`});

  if(o.dec)S.push({final:true,q:`Now put the decimal point in your answer straight above the decimal point in ${o.sn}. Type the answer.`});
  else S.push({final:true,q:o.r?'Read the digits above the box. What is left at the end is the remainder. Type the answer like '+rEx(o)+'.':'Read the digits above the box. Type the answer. (Check: answer × divisor should equal the number in the box.)'});

}

function estimate(o){if(o.op!=='m'||o.dp)return '';const rd=v=>{const p=10**(String(v).length-1);return Math.round(v/p)*p};return `Check yourself: ${N(o.a)} is about ${N(rd(o.a))} and ${o.b} is about ${N(rd(o.b))}, so the answer should be close to ${N(rd(o.a)*rd(o.b))}.`}
function method(o){
  if(o.op==='m'){
    if(o.dp&&!o.money)return 'Multiply the numbers as if there were no decimal points. Then count all the digits after the decimal points in both numbers, and put that many digits after the decimal point in your answer.';
    if(o.b<10)return `Multiply the ones digit first: ${o.b} × ${o.a%10}. Write the ones digit of that answer below the line and carry the tens digit above the next column. Then multiply the next digit and add the number you carried.`;
    return `Multiply in two rows. Row 1: ${o.sa} × ${o.b%10} (the ones digit). Row 2: write a 0 in the ones place first, then multiply by ${Math.floor(o.b/10)%10} (the tens digit). Then add the two rows.${o.money?' Put the dollar sign and the decimal point (two digits after it) in the answer.':''}`}
  if(o.dec)return `Divide as if there were no decimal point, using Divide, Multiply, Subtract, Bring down. Then put the decimal point in the answer straight above the decimal point in ${o.sn}.`;
  return `Use the four steps from your book: Divide, Multiply, Subtract, Bring down. Start on the left: how many ${o.d}s are in the first ${o.d>=10||+String(o.n)[0]<o.d?'two digits':'digit'}? Write it above the box, multiply, subtract, then bring down the next digit and repeat.${o.r?' Whatever is left at the end is the remainder.':''} Check by multiplying your answer by ${o.d}${o.r?' and adding the remainder':''}.`}
function diagnose(o,raw){ // a short, specific nudge for common mistakes (still never the answer)
  const v=raw.replace(/[$,\s]/g,'');

    const A=o.a,B=o.b,o1=B%10,t1=Math.floor(B/10)%10;const nn=o.dp?Math.round(n*10**o.dp):n;
    if(B>=10&&nn===A*o1+A*t1)return 'It looks like row 2 is missing its 0. When you multiply by the tens digit, write a 0 in the ones place first.';
    if(nn===A+B)return 'It looks like you added. This problem says multiply (×).';
    if(o.dp&&[-3,-2,-1,1,2,3].some(k=>Math.abs(n*10**k-o.prod/10**o.dp)<1e-9))return 'Your digits look right. Check where you put the decimal point.';

  const m=v.replace(/remainder|rem/i,'R').match(/^(\d+(?:\.\d+)?)(?:R(\d+))?$/i);if(!m)return '';

  if(!o.dec&&q*o.d+r!==o.n&&String(q).length<String(o.q).length)return 'Check that you wrote a digit above every digit after you started, even when the digit is 0.';
  if(!o.dec&&q===o.q&&r!==o.r)return 'Check your last subtraction to find the remainder.';
  if(o.dec&&Math.round(q*10)!==o.q&&[1,100].some(f=>Math.abs(q*f-o.q/10)<1e-9))return 'Your digits look right. Check where you put the decimal point.';
  return ''}

function isRight(o,raw){

  const m=v.replace(/\s+/g,' ').match(/^(\d+)\s*(?:r|rem|remainder)?\s*(\d+)?$/i);if(!m)return null;

   <section><h3>Practice by day</h3>${rows?`<div class="tbl"><table><tr><th>Day</th><th>Done</th><th>First try</th><th>With help</th><th>Not solved</th><th>Time</th><th>Hints</th></tr>${rows}</table></div>`:'<p class="tip">No practice yet. Results appear here after her first problem.</p>'}</section>
   <section><h3>Recent mistakes</h3>${mis||'<p class="tip">No mistakes yet.</p>'}</section>
   <section class="row"><button class="btn ghost" id="copyBtn" type="button">Copy report</button><span class="tip" id="copyMsg"></span></section>
   <textarea id="repText" readonly hidden aria-label="Report text"></textarea>`;
  $('copyBtn').onclick=copyReport}
function reportText(){const L=[`Math Climb report (${dayKey()})`,''];
  TOPICS.forEach(t=>{const st=tst(t.id);if(!st.n)return;const [op,lv]=t.steps[Math.min(st.i,t.steps.length-1)];L.push(`${t.title}: ${st.done?'finished':`step ${st.i+1} of ${t.steps.length} (${stepName(op,lv)}, ${GRADE(lv)})`}, ${st.first}/${st.n} first try`)});
  L.push('');Object.entries(DB.days).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7).forEach(([k,D])=>L.push(`${k}: ${D.items.filter(x=>x.r==='first').length}/${D.items.length} first try, ${fmtS(D.secs)}, ${D.hints} hints`));
  L.push('','Recent mistakes:');DB.log.filter(e=>e.r!=='first').slice(-15).reverse().forEach(e=>L.push(`- ${e.q}: answered ${e.a.join(', ')||'-'}; correct ${e.c} (${e.r==='missed'?'not solved yet':'solved with help'})`));return L.join('\n')}
function copyReport(){const t=reportText(),ta=$('repText');ta.value=t;
  const fall=()=>{ta.hidden=false;ta.select();$('copyMsg').textContent='Select all and copy the text below.'};
  try{navigator.clipboard.writeText(t).then(()=>{$('copyMsg').textContent='Copied.'},fall)}catch(e){fall()}}

// ---------- confetti ----------
function confetti(n){try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  const c=$('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement),cols=['--accent','--accent-2','--sun','--good'].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:n},()=>({x:c.width/2+(Math.random()-.5)*120,y:c.height*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:4+Math.random()*5,c:cols[Math.floor(Math.random()*4)],r:Math.random()*6}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++t<90)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
// ---------- start ----------
load();
if(DB.round&&!TP(DB.round.tid))DB.round=null;
render();
</script>
